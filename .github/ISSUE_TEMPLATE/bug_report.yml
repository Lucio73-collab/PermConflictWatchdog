name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PermConflictWatchdog version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software and version
      placeholder: e.g. Paper 26.2 build 116
  - type: textarea
    id: plugins
    attributes:
      label: Plugin list
      description: Output of /plugins
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
